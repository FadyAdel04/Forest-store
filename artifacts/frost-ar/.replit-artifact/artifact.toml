kind = "web"
previewPath = "/"
title = "FROST — أزياء الشتاء"
description = "متجر أزياء شتوية عربي متعدد العلامات التجارية، بتجربة تسوق RTL كاملة تشمل استكشاف المنتجات والبحث والمفضلة والسلة وإتمام طلب تجريبي."
version = "1.0.0"
id = "artifacts/frost-ar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21418

[services.development]
run = "pnpm --filter @workspace/frost-ar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frost-ar", "run", "build" ]
serve = "static"
publicDir = "artifacts/frost-ar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21418"
BASE_PATH = "/"
